<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f1d4a"/>
    </linearGradient>
    <clipPath id="diamondClip">
      <path d="M256 56 L402 210 L256 450 L110 210 Z"/>
    </clipPath>
  </defs>

  <!-- Dark background rounded square -->
  <rect width="512" height="512" rx="96" fill="#0a0a0a"/>

  <!-- Main diamond body -->
  <path d="M256 56 L402 210 L256 450 L110 210 Z" fill="url(#diamondGrad)"/>

  <!-- Ark hull - overlays bottom of diamond -->
  <path d="M128 326 C180 378, 226 416, 256 450 C286 416, 332 378, 384 326 
           C328 348, 290 358, 256 358 C222 358, 184 348, 128 326 Z" 
        fill="url(#hullGrad)"/>

  <!-- Hull top edge - cyan glitch accent -->
  <path d="M128 326 C184 348, 222 358, 256 358 C290 358, 328 348, 384 326" 
        fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Inner diamond cutout (negative space) -->
  <polygon points="256,165 310,235 256,325 202,235" 
           fill="#0a0a0a" opacity="0.95"/>

  <!-- Glitch: RGB split - cyan offset left -->
  <path d="M256 56 L402 210 L256 450" 
        fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.5" 
        transform="translate(-10,0)"/>

  <!-- Glitch: RGB split - magenta offset right -->
  <path d="M256 56 L110 210 L256 450" 
        fill="none" stroke="#ff00a0" stroke-width="4" stroke-opacity="0.5" 
        transform="translate(10,0)"/>

  <!-- Horizontal tearing glitch lines -->
  <line x1="140" y1="160" x2="230" y2="160" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="290" y1="270" x2="380" y2="270" stroke="#ff00a0" stroke-width="3" stroke-opacity="0.7"/>
  <line x1="160" y1="380" x2="250" y2="380" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Pixel displacement glitch chunk -->
  <rect x="120" y="190" width="40" height="16" fill="#dc2626" opacity="0.6" transform="translate(-6,0)"/>
  <rect x="360" y="240" width="35" height="14" fill="#dc2626" opacity="0.6" transform="translate(8,0)"/>

  <!-- Scan lines overlay (subtle) -->
  <g clip-path="url(#diamondClip)" opacity="0.08">
    <line x1="0" y1="80" x2="512" y2="80" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="120" x2="512" y2="120" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="160" x2="512" y2="160" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="200" x2="512" y2="200" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="240" x2="512" y2="240" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="280" x2="512" y2="280" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="320" x2="512" y2="320" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="360" x2="512" y2="360" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="400" x2="512" y2="400" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
