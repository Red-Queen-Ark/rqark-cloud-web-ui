    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('themeStore') || '{}') || {};
          var mode = s.mode || 'system';
          // 'system' is resolved here as well, so the first paint already
          // matches the OS instead of flashing the light theme.
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', (s.family || 'base') + '-' + mode);
          document.documentElement.style.colorScheme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', mode === 'dark' ? '#101010' : '#ffffff');
          }
        } catch (e) {}
        // The launch splash only exists to cover the gap iOS leaves between its
        // own launch image and the first frame the app paints. A browser tab has
        // no such gap, so the splash must never show there.
        (function () {
          try {
            var standalone = navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
            var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (standalone && ios) {
              document.documentElement.classList.add('ios-standalone');
            }
          } catch (e) {}
        })();
      })();
    </script>

    <style>
      /*
       * iOS paints its launch image, then goes blank until the webview has a
       * frame to show. #boot-splash fills that gap with the same artwork, so the
       * hand-off is invisible. A browser tab has no gap and no launch image, so
       * the splash stays out of the way there - only the iOS standalone class the
       * inline script sets above turns it on.
       */
      #boot-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        place-items: center;
        background: #141414;
        /* If the app never boots, the splash must not wall the screen off. */
        animation: boot-splash-timeout 240ms ease-out 6s forwards;
      }
      html.ios-standalone #boot-splash {
        display: grid;
      }
      /*
       * The launch images draw the mark in a box 62% of the shorter edge, so the
       * splash draws it at the same size: a matched device hands over without the
       * mark moving or resizing, and a stretched launch image is corrected here.
       */
      #boot-splash svg {
        display: block;
        width: 62vmin;
        height: auto;
        transition: opacity 160ms ease-out;
      }
      #boot-splash.is-going svg {
        opacity: 0;
      }
      #boot-splash.is-going {
        transition: opacity 160ms ease-out;
        opacity: 0;
        pointer-events: none;
      }
      @keyframes boot-splash-timeout {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
