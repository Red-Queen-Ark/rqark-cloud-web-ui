    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('themeStore') || '{}') || {};
          var mode = s.mode || 'system';
          // 'system' is resolved here as well, so the first paint already
          // matches the OS instead of flashing the light theme.
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', (s.family || 'base') + '-' + mode);
          document.documentElement.style.colorScheme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', mode === 'dark' ? '#101010' : '#ffffff');
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* The launch artwork's own background, so the swap is invisible. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #141414;
      }
      /*
       * The mark keeps its own aspect ratio (logo.svg is square), so it looks
       * the same in any window — a stretched launch image cannot be produced
       * from here. 24vmin of the shorter edge, capped, is about the size the
       * mark has on the home screen.
       */
      #boot-splash img {
        display: block;
        width: min(24vmin, 180px);
        height: auto;
      }
    </style>

  <body class="h-dvh w-full overflow-hidden">
    <!--
      iOS paints a launch image before any of this can run, and it stretches
      that image whenever none of the media queries above describes the device
      exactly - which is every resized window (Stage Manager, Split View,
      Slide Over). The launch images therefore carry only the app background,
      and the mark is drawn here, in the first frame the app controls, at its
      true aspect ratio. It steps aside as soon as the first route is ready.
    -->
    <div id="boot-splash" aria-hidden="true"><img src="/logo.svg" alt="" width="512" height="512" /></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
