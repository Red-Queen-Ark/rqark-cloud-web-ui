    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('themeStore') || '{}') || {};
          var mode = s.mode || 'system';
          // 'system' is resolved here as well, so the first paint already
          // matches the OS instead of flashing the light theme.
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', (s.family || 'base') + '-' + mode);
          document.documentElement.style.colorScheme = mode;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', mode === 'dark' ? '#101010' : '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
