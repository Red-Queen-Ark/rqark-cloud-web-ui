name: Desktop

on:
  push:
    branches:
      - feat/desktop/wails
  workflow_dispatch:

env:
  APP_NAME: RqArk Agent Cloud
  BIN_NAME: rqark-agent-cloud

jobs:
  windows:
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: DESKTOP_BUILD=true bun run build
      - name: Build executable
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -H windowsgui" \
            -o "bin/$BIN_NAME.exe" .
      - uses: actions/upload-artifact@v3
        with:
          name: windows-amd64
          path: bin/rqark-agent-cloud.exe

  macos:
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build the app bundle
        run: ./scripts/package-app.sh
      - name: Archive the app bundle
        run: |
          tar -C bin -czf bin/rqark-agent-cloud-macos-arm64.tar.gz "$APP_NAME.app"
      - uses: actions/upload-artifact@v3
        with:
          name: macos-arm64
          path: bin/rqark-agent-cloud-macos-arm64.tar.gz

  publish:
    needs: [windows, macos]
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v3
        with:
          path: dist
      - name: Publish the pre-release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          TAG="desktop-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          files=$(find dist -type f)
          args=""
          for f in $files; do
            args="$args -F attachment=@$f"
          done
          # shellcheck disable=SC2086
          curl -sS -X POST "$GITEA/api/v1/repos/$REPO/releases" \
            -H "Authorization: token $TOKEN" \
            -F "tag_name=$TAG" \
            -F "name=$APP_NAME $TAG" \
            -F "body=Desktop build of $GITHUB_SHA." \
            -F "prerelease=true" \
            $args
