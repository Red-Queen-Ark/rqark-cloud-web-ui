name: Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  BIN_NAME: rqark-agent-cloud

jobs:
  prepare:
    runs-on: carhyme-gitea-runner
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve the release
        id: release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "push" ] && [ "${REF#v}" != "$REF" ]; then
            TAG="$REF"
            PRERELEASE=false
          else
            TAG="desktop-$(date -u +%Y%m%d%H%M)-$(echo "$SHA" | cut -c1-7)"
            PRERELEASE=true
          fi
          STATUS=""
          for _ in 1 2 3 4 5 6; do
            BODY=$(curl -sS -w '\n%{http_code}' "$GITEA/api/v1/repos/$REPO/releases/tags/$TAG" \
              -H "Authorization: token $TOKEN")
            STATUS=$(printf '%s' "$BODY" | tail -n 1)
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            BODY=$(curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases" \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"Desktop build of $SHA.\",\"prerelease\":$PRERELEASE}")
          fi
          ID=$(printf '%s' "$BODY" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: DESKTOP_BUILD=true bun run build
      - name: Build the executable
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -H windowsgui" \
            -o "bin/$BIN_NAME.exe" .
      - name: Attach it to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.id }}
        run: |
          set -eu
          curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets?name=$BIN_NAME.exe" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@bin/$BIN_NAME.exe" >/dev/null

  macos:
    needs: prepare
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the app bundle
        run: ./scripts/package-app.sh
      - name: Archive it
        run: tar -C bin -czf bin/$BIN_NAME-macos-arm64.tar.gz "RqArk Agent Cloud.app"
      - name: Attach it to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.id }}
        run: |
          set -eu
          curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets?name=$BIN_NAME-macos-arm64.tar.gz" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@bin/$BIN_NAME-macos-arm64.tar.gz" >/dev/null
