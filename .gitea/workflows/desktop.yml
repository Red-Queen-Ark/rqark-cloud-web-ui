name: Desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to attach the builds to; leave empty for a generated desktop-<date>-<sha> tag'
        required: false

env:
  BIN_NAME: rqark-agent-cloud

jobs:
  prepare:
    runs-on: carhyme-gitea-runner
    outputs:
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the release
        id: release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -eu
          TAG="${TAG_INPUT:-desktop-$(date -u +%Y%m%d%H%M)-$(echo "$SHA" | cut -c1-7)}"
          PRERELEASE=true

          STATUS=""
          for _ in 1 2 3 4 5 6; do
            BODY=$(curl -sS -w '\n%{http_code}' "$GITEA/api/v1/repos/$REPO/releases/tags/$TAG" \
              -H "Authorization: token $TOKEN")
            STATUS=$(printf '%s' "$BODY" | tail -n 1)
            if [ "$STATUS" = "200" ]; then
              break
            fi
            sleep 5
          done

          if [ "$STATUS" = "200" ]; then
            ID=$(printf '%s' "$BODY" | tr '{' '\n' | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
            curl -sS -X PATCH "$GITEA/api/v1/repos/$REPO/releases/$ID" \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"prerelease":true}' >/dev/null
          else
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
            RANGE="$SHA"
            if [ -n "$PREV" ]; then
              RANGE="$PREV..$SHA"
            fi
            NOTES=$(git log --no-merges --pretty='- %s' "$RANGE" 2>/dev/null | head -n 40 | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | awk 'BEGIN { ORS = "\\n" } { print }' | sed 's/\\n$//' || true)
            if [ -z "$NOTES" ]; then
              NOTES="Release $TAG."
            fi
            BODY=$(curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases" \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"$SHA\",\"body\":\"$NOTES\",\"prerelease\":$PRERELEASE}")
            ID=$(printf '%s' "$BODY" | tr '{' '\n' | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          fi

          if [ -z "$ID" ]; then
            echo "no release id for $TAG" >&2
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: DESKTOP_BUILD=true bun run build
      - name: Build the executable
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -H windowsgui" \
            -o "bin/$BIN_NAME.exe" .
      - name: Attach it to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.id }}
        run: |
          set -eu
          ASSET="$BIN_NAME.exe"
          ASSETS=$(curl -sSf "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets" \
            -H "Authorization: token $TOKEN")
          OLD_ID=$(printf '%s' "$ASSETS" | tr '{' '\n' | grep -F "\"name\":\"$ASSET\"" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2 || true)
          if [ -n "$OLD_ID" ]; then
            curl -sSf -X DELETE "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets/$OLD_ID" \
              -H "Authorization: token $TOKEN"
          fi
          curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@bin/$ASSET" >/dev/null
          echo "attached $ASSET to release $RELEASE_ID"

  macos:
    needs: prepare
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the app bundle
        run: ./scripts/package-app.sh
      - name: Archive it
        run: tar -C bin -czf bin/$BIN_NAME-macos-arm64.tar.gz "RqArk Agent Cloud.app"
      - name: Attach it to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.id }}
        run: |
          set -eu
          ASSET="$BIN_NAME-macos-arm64.tar.gz"
          ASSETS=$(curl -sSf "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets" \
            -H "Authorization: token $TOKEN")
          OLD_ID=$(printf '%s' "$ASSETS" | tr '{' '\n' | grep -F "\"name\":\"$ASSET\"" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2 || true)
          if [ -n "$OLD_ID" ]; then
            curl -sSf -X DELETE "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets/$OLD_ID" \
              -H "Authorization: token $TOKEN"
          fi
          curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases/$RELEASE_ID/assets?name=$ASSET" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@bin/$ASSET" >/dev/null
          echo "attached $ASSET to release $RELEASE_ID"
