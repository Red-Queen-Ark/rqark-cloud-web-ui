name: Desktop

on:
  push:
    branches:
      - feat/desktop/wails
  workflow_dispatch:

env:
  BIN_NAME: rqark-agent-cloud

jobs:
  # The tag is fixed once, so both builds attach to the same release.
  prepare:
    runs-on: carhyme-gitea-runner
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Create the pre-release
        id: tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          TAG="desktop-$(date -u +%Y%m%d%H%M)-$(echo "$SHA" | cut -c1-7)"
          curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases" \
            -H "Authorization: token $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Desktop $TAG\",\"body\":\"Desktop build of $SHA.\",\"prerelease\":true}" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  windows:
    needs: prepare
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: DESKTOP_BUILD=true bun run build
      - name: Build the executable
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -H windowsgui" \
            -o "bin/$BIN_NAME.exe" .
      - name: Attach it to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases/$TAG/assets?name=$BIN_NAME.exe" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@bin/$BIN_NAME.exe" >/dev/null

  macos:
    needs: prepare
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the app bundle
        run: ./scripts/package-app.sh
      - name: Archive it
        run: tar -C bin -czf bin/$BIN_NAME-macos-arm64.tar.gz "RqArk Agent Cloud.app"
      - name: Attach it to the release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEA: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          curl -sSf -X POST "$GITEA/api/v1/repos/$REPO/releases/$TAG/assets?name=$BIN_NAME-macos-arm64.tar.gz" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@bin/$BIN_NAME-macos-arm64.tar.gz" >/dev/null
