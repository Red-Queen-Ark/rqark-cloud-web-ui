name: Desktop

on:
  push:
    branches:
      - feat/desktop/wails
  workflow_dispatch:

jobs:
  windows:
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: DESKTOP_BUILD=true bun run build
      - name: Build executable
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -trimpath -ldflags "-s -w -H windowsgui" \
            -o bin/rqark-agent-cloud.exe .
      - uses: actions/upload-artifact@v3
        with:
          name: rqark-agent-cloud-windows-amd64
          path: bin/rqark-agent-cloud.exe

  macos:
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build app bundle
        run: ./scripts/package-app.sh
      - name: Archive app bundle
        run: |
          mkdir -p bin
          ditto -c -k --keepParent "bin/RqArk Agent Cloud.app" bin/rqark-agent-cloud-macos.zip
      - uses: actions/upload-artifact@v3
        with:
          name: rqark-agent-cloud-macos
          path: bin/rqark-agent-cloud-macos.zip
