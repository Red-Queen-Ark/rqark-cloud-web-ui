name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: Type check and build
      run: bun run build

    - name: Test
      run: bun run test --run

  desktop:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    # main.go embeds all:dist, so the Go side only compiles once the frontend
    # has been built. Building it here rather than faking the directory also
    # proves the embed target exists.
    - name: Build the frontend
      run: bun install --frozen-lockfile && bun run build

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

    - name: Test
      run: go test -tags purego ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install Playwright browsers
      run: bunx playwright install --with-deps chromium

    - name: End-to-end tests
      run: bunx playwright test --project=chromium

    - name: Upload the report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
