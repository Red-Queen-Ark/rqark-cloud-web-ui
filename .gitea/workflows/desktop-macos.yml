name: Desktop macOS

on:
  push:
    branches:
      - feat/desktop/wails
  workflow_dispatch:

env:
  BIN_NAME: rqark-agent-cloud

jobs:
  macos:
    runs-on: carhyme-gitea-runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build the app bundle
        run: ./scripts/package-app.sh
      - name: Archive it
        run: tar -C bin -czf "bin/$BIN_NAME-macos-arm64.tar.gz" "RqArk Agent Cloud.app"
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: bin/rqark-agent-cloud-macos-arm64.tar.gz
          archive: false
