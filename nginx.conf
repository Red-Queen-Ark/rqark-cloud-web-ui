server {
    listen 80;
    listen [::]:80;

    # 启用 gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
    gzip_comp_level 6;
    gzip_proxied any;


    # 设定 MIME types
    include /etc/nginx/mime.types;

    # 基本安全设定
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # 增加伺服器效能的配置
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    proxy_connect_timeout 90;
    proxy_send_timeout 90;
    proxy_read_timeout 90;
    proxy_buffer_size 4k;
    proxy_buffers 4 32k;
    proxy_busy_buffers_size 64k;

    # API proxy. The backend runs in its own compose project on the Docker host
    # which is reachable through
    # host.docker.internal.
    location /api/ {
        proxy_pass http://host.docker.internal:7302;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The agent cloud is a second service, running in
    # its own compose project on port 8000. The chat session lives there, not on
    # the data cloud, so it gets its own prefix instead of riding /api above.
    # The prefix maps onto the agent cloud's own /api prefix, which keeps the
    # socket same-origin: no extra port to open in the browser, and it upgrades
    # to wss by itself when this server is put behind TLS.
    location /agent-api/ {
        proxy_pass http://host.docker.internal:8000/api/;
        # The chat session is a WebSocket: nginx drops the hop-by-hop upgrade
        # headers unless they are put back, and the default 90s read timeout
        # would close a chat that is simply waiting for the other side to type.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /www;
        index index.html;
        try_files $uri $uri/ /index.html;

        # 设定快取控制
        location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # 动态内容不快取
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires -1;
        }

        # 错误处理
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_intercept_errors on;

        # 基本的代理设定
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
